<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">verified-analyst: an AI data analyst that can't invent numbers</title><desc id="d">A draft answer says iOS leads with 4,812 users and Android has 3,100. The checker rejects it because those numbers were never returned by a query. A second draft built from the query result, android 1,616 and ios 1,384, is accepted.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs>
<rect width="1200" height="440" rx="24" fill="#060b0d"/><rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#1c2433"/>
<text x="56" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" letter-spacing="2" fill="#6f8a90">MCP SERVER · DETERMINISTIC CHECKER</text>
<text x="56" y="164" font-size="56" font-weight="800" letter-spacing="-1.5" fill="#f2faf9">verified-analyst</text>
<text x="56" y="222" font-size="32" font-weight="700" fill="url(#g)">An AI data analyst that</text>
<text x="56" y="260" font-size="32" font-weight="700" fill="url(#g)">can’t invent numbers.</text>
<text x="56" y="312" font-size="22" fill="#a3bcc0">Every figure must trace back to a real</text>
<text x="56" y="342" font-size="22" fill="#a3bcc0">SQL result, or the answer goes back.</text>
<text x="56" y="372" font-size="22" fill="#a3bcc0">No LLM judges it: the check is code.</text>
<text x="56" y="416" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#58727a">Python · DuckDB · MCP · MIT</text>
<rect x="580" y="50" width="564" height="340" rx="18" fill="#0b1417" stroke="#183036"/>
<text x="604" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#6f8a90">DRAFT 1 · numbers from memory</text><text x="604" y="120" font-size="23"><tspan fill="#e6f1f0" font-weight="500">iOS leads with </tspan><tspan fill="#ff6b6b" font-weight="800">4,812</tspan><tspan fill="#e6f1f0" font-weight="500"> users,</tspan></text><text x="604" y="150" font-size="23"><tspan fill="#e6f1f0" font-weight="500">followed by Android with </tspan><tspan fill="#ff6b6b" font-weight="800">3,100</tspan><tspan fill="#e6f1f0" font-weight="500">.</tspan></text>
<rect x="604" y="166" width="516" height="40" rx="10" fill="#ff6b6b" fill-opacity=".14" stroke="#ff6b6b" stroke-opacity=".55"/><text x="624" y="193" font-size="20" font-weight="700" fill="#ff6b6b">✗ rejected · numbers never queried</text>
<line x1="604" x2="1120" y1="224" y2="224" stroke="#183036"/>
<text x="604" y="252" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#6f8a90">DRAFT 2 · numbers from the query</text><text x="604" y="286" font-size="23"><tspan fill="#e6f1f0" font-weight="500">android leads with </tspan><tspan fill="#4cd08a" font-weight="800">1,616</tspan><tspan fill="#e6f1f0" font-weight="500"> users,</tspan></text><text x="604" y="316" font-size="23"><tspan fill="#e6f1f0" font-weight="500">followed by ios with </tspan><tspan fill="#4cd08a" font-weight="800">1,384</tspan><tspan fill="#e6f1f0" font-weight="500">.</tspan></text>
<rect x="604" y="332" width="516" height="40" rx="10" fill="#4cd08a" fill-opacity=".14" stroke="#4cd08a" stroke-opacity=".55"/><text x="624" y="359" font-size="20" font-weight="700" fill="#4cd08a">✓ accepted · every number traced to SQL</text>
</svg>